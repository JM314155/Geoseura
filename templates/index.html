{% extends "layout.html" %}
{% block title %}Etusivu{% endblock %}
{% block content %}
<h2>Uusimmat kätköt</h2>

{% for item in items %}
<div class="item">
  <a href="/item/{{ item.id }}">{{ item.title }}</a> <br />
  Piilottaja: <a href="/user/{{ item.user_id }}">{{ item.username }}</a> <br />
  Löytöjä yhteensä: {{ item.visit_count }}
</div>
{% else %}
<p>Ei kätköjä vielä.</p>
{% endfor %}
{% endblock %}
